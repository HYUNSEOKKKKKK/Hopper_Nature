name: Public interface checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-and-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      # Licensed RaiSim simulation checks run locally; see docs/validation.md.
