seed: 1
record_video: no

environment:
  render: True
# just testing commenting
  num_envs: 400
  eval_every_n: 500
  num_threads: 60
  simulation_dt: 0.001
  control_dt: 0.01
  max_time: 4.0
  reward:
    # pos reward
    comAngularVel: 10
    comLinearVel:  10

    # neg reward (not reward coefficient, about range)
    footSlip:    -0.75
    smoothness2: -0.5 #-2.5
    bodyOri:     -2.0 #-0.5
    torque:      -1e-4 #-5e-5

    armPos:   -1e-1
    footPos:  -6.0
    jointVel:    -5e-4
    jointAcc:    -5e-3

    # relaxed
    barrierJointPos:      1e-1
    barrierBodyHeight:    1e-1
    barrierBaseMotion:    1e-1
    barrierJointVel:      1e-1
    barrierTargetVel:     1e-1
    barrierFootContact:   1e-1
    barrierFootClearance: 1e-1

    # total sum
    negSumPos:          1.0 #1.0
    relaxedLog:         1.0

    # only for record
    negReward2: 1.0

architecture:
  policy_net: [ 256, 128, 64 ]
  estimator_net: [ 256, 128]
  value_net: [256, 128, 64 ]
  barrier_value_net: [256, 128, 64 ]

