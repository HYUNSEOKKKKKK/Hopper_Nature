seed: 1
record_video: no

environment:
  render: True
# just testing commenting
  num_envs: 400
  eval_every_n: 2000
  num_threads: 60
  simulation_dt: 0.001
  control_dt: 0.01
  max_time: 4.0
  reward:
    # pos reward
    comAngularVel: 12
    comLinearVel:  12

    # neg reward (not reward coefficient, about range)
    footSlip:    -0.75
    smoothness1: -0.0 #-5.0
    smoothness2: -2.5 #-2.5
    bodyOri:     -0.5 #-0.5
    torque:      -1e-4 #-5e-5

    jointPos:    -1.0
    jointVel:    0.0 #-1e-4 #-1e-3 # -5e-3
    jointAcc:    -5e-2 # -1e-3 #-1e-2 # -4e-2

    # relaxed
    barrierJointPos:      1e-1
    barrierBodyHeight:    1e-1
    barrierBaseMotion:    1e-1
    barrierJointVel:      1e-1
    barrierTargetVel:     1e-1
    barrierFootContact:   1e-1
    barrierFootClearance: 1e-1

    # total sum
    standingReward:     0.0
    negSumPos:          1.0 #1.0
    relaxedLog:         1.0

    # only for record
    negReward2: 1.0
    standingRewardLogging2: 1.0

architecture:
  policy_net: [ 256, 128, 64 ]
  estimator_net: [ 256, 128]
  value_net: [256, 128, 64 ]
  barrier_value_net: [256, 128, 64 ]

