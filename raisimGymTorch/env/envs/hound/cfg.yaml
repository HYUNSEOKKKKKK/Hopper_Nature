seed: 1
record_video: yes

environment:
  render: True
# just testing commenting
  num_envs: 400
  eval_every_n: 500
  num_threads: 30
  simulation_dt: 0.001
  control_dt: 0.01
  max_time: 4.0
  reward:
    # pos reward
    comAngularVel: 8
    comLinearVel:  8

    # neg reward (not reward coefficient, about range)
    footSlip: -5e-1
    smoothness1: -2.5 #-2.5
    smoothness2: -1.2 #-1.2
    bodyOri: -2.5

    torque:   -1e-4
    jointPos : -1.0
    jointAcc : -5e-2
    standingJointVel: -1e-2

    # relaxed
    barrierJointPos:      1e-1
    barrierBodyHeight:    1e-1
    barrierBaseMotion:    1e-1
    barrierJointVel:      1e-1
    barrierTargetVel:     1e-1
    barrierFootContact:   1e-1
    barrierFootClearance: 1e-1

    # total sum
    negReward2: 1.0          # only for record

    standingNegReward : 0.0 #1.0 #2.0 # not used
    negSumPos:         1.0 #1.0
    relaxedLog:         1.0

architecture:
  policy_net: [ 256, 128, 64 ]
  estimator_net: [ 256, 128]
  value_net: [256, 128, 64 ]
  barrier_value_net: [256, 128, 64 ]

